services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  keycloak:
    image: keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/app-realm.json:/opt/keycloak/data/import/app-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  keycloak-init:
    image: keycloak/keycloak:26.7.2
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_SERVER: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/assign-roles.sh:/opt/keycloak/assign-roles.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak/assign-roles.sh"]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: backend-toolkit-example/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP__NAME: Toolkit Example
      APP__ENVIRONMENT: development
      APP__DEBUG: "true"
      DATABASE__URL: postgresql+asyncpg://postgres:postgres@postgres:5432/app
      DATABASE__ECHO: "false"
      STORAGE__BACKEND: s3
      STORAGE__BUCKET: app
      STORAGE__ENDPOINT_URL: http://minio:9000
      STORAGE__ACCESS_KEY: minioadmin
      STORAGE__SECRET_KEY: minioadmin
      STORAGE__REGION: us-east-1
      STORAGE__USE_SSL: "false"
      STORAGE__CREATE_BUCKET: "true"
      AUTH__BACKEND: keycloak
      AUTH__SERVER_URL: http://keycloak:8080
      AUTH__PUBLIC_URL: http://localhost:8080
      AUTH__REALM: app
      AUTH__CLIENT_ID: backend
      AUTH__CLIENT_SECRET: backend-secret
      LOG_LEVEL: INFO
      LOG_ENVIRONMENT: development
      LOG_COLORS: "false"
      LOG_CONSOLE: "true"
      LOG_FILE: logs/app.log
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
